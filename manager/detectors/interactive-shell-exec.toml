id = "interactive-shell-exec"
name = "Interactive Shell Execution"
description = "Flags execution of interactive shells from non-system processes."
severity = "info"
tags = ["execution", "shell"]
summary_template = "{comm} executed {subject}"

[match]
event_types = ["execve"]
subject_contains = ["/bin/bash", "/bin/sh", "/bin/dash", "/bin/zsh", "/bin/fish"]
comm_not_in = ["python3", "python", "cron", "systemd", "sshd", "gdm-session-wor", "dpkg", "apt", "unattended-upgr"]
