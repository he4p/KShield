site_name: Ataree
site_description: Runtime security for Linux using eBPF
site_author: hxuu

repo_name: hxuu/ataree
repo_url: https://github.com/hxuu/ataree

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

markdown_extensions:
    - pymdownx.highlight
    - pymdownx.superfences
    - pymdownx.details
    - admonition
    - toc:
          permalink: true

nav:
  - Home: index.md
  - Current Detectors: current-detectors.md
  - Extensibility Guide: extensibility.md
  - Detectors Format: detectors.md
  - Architecture: architecture.md
  - Extension Plan: extension-plan.md
  - Signature AV LSM: signature-av-lsm.md

