<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KShield Manager</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>KShield</h1>
        <p>Kernel Threat Detection and eBPF-LSM IPS Control Plane</p>
      </header>

      <section class="cards">
        <article class="card">
          <h2>Agents</h2>
          <p id="agents-count">0</p>
        </article>
        <article class="card">
          <h2>Total Events</h2>
          <p id="events-count">0</p>
        </article>
        <article class="card">
          <h2>Blocked</h2>
          <p id="blocked-count">0</p>
        </article>
        <article class="card">
          <h2>Blocked IPs</h2>
          <p id="policy-count">0</p>
        </article>
      </section>

      <section class="panel">
        <h2>Policy: Block IPv4</h2>
        <form id="policy-form">
          <input id="ip-input" type="text" placeholder="203.0.113.10" required />
          <button type="submit">Block</button>
        </form>
        <div id="policy-list"></div>
      </section>

      <section class="panel">
        <h2>Agents</h2>
        <div class="table-wrap">
          <table id="agents-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Host</th>
                <th>IP</th>
                <th>Kernel</th>
                <th>Version</th>
                <th>Last Seen</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2>Recent Events</h2>
        <div class="table-wrap">
          <table id="events-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Agent</th>
                <th>Type</th>
                <th>Action</th>
                <th>Severity</th>
                <th>Proc</th>
                <th>Dst</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
  </html>
